name: Sync upstream releases

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '23 4 * * *' # Daily, off the top of the hour
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  UPSTREAM_REPO: https://github.com/dani-garcia/vaultwarden.git

jobs:
  sync-tags:
    name: Mirror new upstream release tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.push-tags.outputs.tag }}
    # SYNC_TOKEN is scoped to the `release` environment
    environment: release
    permissions:
      contents: read
    steps:
      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the
      # Release workflow would never run. A PAT (SYNC_TOKEN secret) is required.
      - name: Verify SYNC_TOKEN is configured
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [[ -z "${SYNC_TOKEN}" ]]; then
            echo "::error::SYNC_TOKEN secret is not available."
            echo "::error::Add it as a repository secret, or as a secret of the 'release' environment (which this job uses)."
            echo "::error::Until then, release tags can be pushed manually from a local clone."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch upstream tags
        run: |
          git remote add upstream "${UPSTREAM_REPO}"
          git fetch --no-tags upstream '+refs/tags/*:refs/tags/*'

      - name: Push new upstream release tags
        id: push-tags
        run: |
          # Release tags which already exist on this fork
          # (lexical sort: `comm` requires collated input; -V ordering breaks on e.g. 1.9 vs 1.10)
          git ls-remote --tags origin \
            | grep -oE 'refs/tags/[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's|refs/tags/||' \
            | LC_ALL=C sort > /tmp/origin-tags.txt || true

          # Release tags available upstream
          git tag --list \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | LC_ALL=C sort > /tmp/upstream-tags.txt || true

          # Only follow NEW upstream releases — never backfill older tags.
          # Backfilling would drag `latest` backwards onto old builds.
          # Mirror upstream's newest tag only while it is not yet on this fork.
          UPSTREAM_MAX="$(sort -V /tmp/upstream-tags.txt | tail -n 1)"
          if grep -qxF "${UPSTREAM_MAX}" /tmp/origin-tags.txt; then
            echo "Newest upstream release (${UPSTREAM_MAX}) is already mirrored"
            exit 0
          fi

          TAG_TO_PUSH="${UPSTREAM_MAX}"
          echo "tag=${TAG_TO_PUSH}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Synced upstream release tag"
            echo ""
            echo "- \`${TAG_TO_PUSH}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Pushing tag ${TAG_TO_PUSH}"
          git push origin "refs/tags/${TAG_TO_PUSH}:refs/tags/${TAG_TO_PUSH}"

  # Build the release images with this fork's pipeline from main.
  # A tag push event would execute the workflow file FROM THE TAGGED COMMIT
  # (upstream's, gated to dani-garcia), so the build must be invoked instead.
  release:
    name: Build release images
    needs: sync-tags
    if: needs.sync-tags.outputs.tag != ''
    permissions:
      contents: read
      packages: write      # push images to GHCR
      attestations: write  # generate artifact attestations
      id-token: write      # OIDC token for Sigstore signing
    uses: ./.github/workflows/release.yml
    # Fork: reusable workflows receive NO secrets by default; pass repo secrets
    # (ACR_USERNAME/ACR_PASSWORD) through to the release pipeline
    secrets: inherit
    with:
      tag: ${{ needs.sync-tags.outputs.tag }}
